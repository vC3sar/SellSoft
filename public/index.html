<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SellSoft - Tienda de Software</title>
    <meta name="description" content="Licencias y software digital al instante">
    <link rel="stylesheet" href="/css/style.css">
    <!-- Using Google Fonts matching the original Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-50 min-h-screen flex flex-col selection:bg-indigo-500/30">
    <header class="sticky top-0 z-50 border-b border-white/10 bg-zinc-950/80 backdrop-blur-md">
        <div class="container mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/" data-link class="font-bold text-xl tracking-tight text-white flex items-center gap-2">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center shadow-[0_0_15px_rgba(79,70,229,0.5)]">
                    <span class="text-white text-sm font-black">SS</span>
                </div>
                SellSoft
            </a>
            
            <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-zinc-400">
                <a href="/" data-link class="hover:text-white transition-colors">Inicio</a>
                <a href="/products" data-link class="hover:text-white transition-colors">Productos</a>
                <a href="/track" data-link class="hover:text-white transition-colors">Rastrear Compra</a>
                <a href="/cart" data-link class="hover:text-white transition-colors">Carrito de compras <span id="cart-count" class="ml-1 bg-indigo-600 text-white px-2 py-0.5 rounded-full text-xs hidden">0</span></a>
            </nav>

            <div class="flex items-center gap-4">
                <div id="auth-section" class="hidden md:flex items-center gap-4 pl-4 border-l border-white/10">
                    <!-- Auth links will be injected here by app.js -->
                </div>
                <!-- Mobile nav button would go here -->
            </div>
        </div>
    </header>

    <main id="app-root" class="flex-1">
        <!-- Route content injected here -->
    </main>

    <footer class="border-t border-white/10 py-12 mt-20">
        <div class="container mx-auto px-4 text-center text-zinc-500 text-sm">
            <p>&copy; 2026 SellSoft. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
